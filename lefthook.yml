pre-commit:
  commands:
    openapi-gen:
      glob: './schema/openapi.yaml'
      run: task openapi-gen
      stage_fixed: true
    biome-check:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc}'
      exclude: '.*\.d\.ts$'
      run: pnpm biome check {staged_files} --write
      stage_fixed: true
    eslint-check-next:
      root: './apps/next-app'
      glob: '**/*.{js,ts,jsx,tsx}'
      exclude: '.*\.d\.ts$'
      run: pnpm lint
      stage_fixed: true
    go-check:
      root: './apps/go-api'
      glob: '**/*.go'
      run: go fmt && go vet
      stage_fixed: true

post-merge:
  commands:
    generate-all:
      run: task generate-all
